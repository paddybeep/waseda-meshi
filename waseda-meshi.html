<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ワセ飯</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8C1515">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ワセ飯">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
<style>
:root {
  /* 早稲田エンジ */
  --brand: #8C1515;
  --brand2: #6B0F0F;
  --brand-light: #F7EEEE;
  --grad: linear-gradient(135deg, #8C1515, #B22222);
  --grad-gold: linear-gradient(135deg, #8C1515, #C9A84C);
  --bg: #F9F6F6;
  --surface: #fff;
  --border: #EDE5E5;
  --text: #1a1010;
  --sub: #5a4040;
  --muted: #a08888;
  --green: #1a9645;
  --yellow: #d4870a;
  --red: #c0392b;
  --nav-h: 60px;
  --radius: 16px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --topbar-h: calc(52px + env(safe-area-inset-top, 0px));
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); }

/* ── TOP BAR ── */
.topbar {
  background: var(--brand);
  position: sticky;
  top: 0;
  z-index: 300;
  padding: env(safe-area-inset-top, 0px) 16px 0;
  height: var(--topbar-h);
  display: flex;
  align-items: flex-end;
  padding-bottom: 0;
  justify-content: space-between;
  gap: 12px;
  box-shadow: 0 2px 10px rgba(140,21,21,0.35);
  padding-left: 16px;
  padding-right: 16px;
  padding-bottom: 8px;
}
.topbar-logo {
  font-size: 22px;
  font-weight: 900;
  color: #fff;
  letter-spacing: -0.5px;
  white-space: nowrap;
  cursor: pointer;
}
.topbar-logo small { font-size: 11px; font-weight: 400; opacity: 0.75; margin-left: 5px; }
.topbar-actions { display: flex; gap: 10px; align-items: center; }
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  cursor: pointer;
  color: #fff;
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 300;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
  transition: color 0.15s;
  padding: 0;
}
.nav-item .ni { font-size: 22px; line-height: 1; }
.nav-item.active { color: var(--brand); }
.nav-item.active .ni { filter: none; }

/* ── VIEWS ── */
.view { display: none; }
.view.active { display: block; }

/* ── HOME VIEW ── */
.stories-wrap {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 7px 0 7px 14px;
  overflow-x: auto;
  scrollbar-width: none;
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.stories-wrap::-webkit-scrollbar { display: none; }
.story {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  flex-shrink: 0;
  padding-right: 2px;
}
.story-ring {
  width: 52px; height: 52px;
  border-radius: 50%;
  padding: 2.5px;
  background: #ddd;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s, transform 0.15s;
  position: relative;
}
.story-ring.active-mood {
  background: var(--grad);
  transform: scale(1.06);
}
.story-inner {
  width: 100%; height: 100%;
  border-radius: 50%;
  background: var(--bg);
  border: 2.5px solid var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.story-ring.active-mood .story-inner { background: #FFF5F5; }
.story-count-badge {
  position: absolute;
  bottom: -2px; right: -2px;
  background: var(--brand);
  color: #fff;
  font-size: 9px;
  font-weight: 800;
  padding: 1px 5px;
  border-radius: 10px;
  border: 1.5px solid var(--surface);
  display: none;
}
.story-ring.active-mood .story-count-badge { display: block; }
.story-label {
  font-size: 10px;
  color: var(--sub);
  max-width: 64px;
  text-align: center;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.story-label.active-mood { color: var(--brand); font-weight: 700; }

/* mood row (below saved stories) */
.mood-row-wrap {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 0 10px 14px;
  overflow-x: auto;
  scrollbar-width: none;
}
.mood-row-wrap::-webkit-scrollbar { display: none; }
.mood-row {
  display: flex;
  gap: 8px;
  align-items: center;
  white-space: nowrap;
}
.mood-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 13px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  color: var(--sub);
  transition: all 0.15s;
  flex-shrink: 0;
}
.mood-chip.active {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}

/* ── SETTINGS SHEET ── */
.settings-section { padding: 14px 18px 0; }
.settings-section-title { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
.settings-row {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 0; border-bottom: 1px solid var(--border);
  font-size: 14px; font-weight: 600;
}
.settings-row:last-child { border-bottom: none; }
.settings-row .sr-icon { font-size: 22px; flex-shrink: 0; }
.settings-row .sr-label { flex: 1; }
.settings-row .sr-arrow { color: var(--muted); }
.lang-toggle { display: flex; gap: 7px; }
.lang-btn {
  padding: 6px 16px; border-radius: 20px; border: 1.5px solid var(--border);
  background: var(--surface); font-size: 13px; font-weight: 700; cursor: pointer;
  color: var(--sub); transition: all 0.15s;
}
.lang-btn.active { background: var(--brand); border-color: var(--brand); color: #fff; }

/* ── LUNCH MATE ── */
.lm-status-row { display: flex; gap: 8px; margin: 14px 0; }
.lm-status-btn {
  flex: 1; padding: 10px 8px; border-radius: 12px; border: 2px solid var(--border);
  background: var(--surface); font-size: 13px; font-weight: 700; cursor: pointer;
  text-align: center; transition: all 0.15s; font-family: inherit;
}
.lm-status-btn.active-now { border-color: #2ecc71; background: #E8F8EE; color: #1a9645; }
.lm-status-btn.active-later { border-color: #f39c12; background: #FEF6E4; color: #d4870a; }
.lm-user-card {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.lm-user-card:last-child { border-bottom: none; }
.lm-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.lm-user-name { font-size: 14px; font-weight: 700; }
.lm-user-meta { font-size: 12px; color: var(--muted); }
.lm-status-dot {
  width: 10px; height: 10px; border-radius: 50%; margin-left: auto; flex-shrink: 0;
}

/* ── LUNCH VIEW (full tab) ── */
.lv-wrap { padding: 14px 16px 80px; max-width: 480px; margin: 0 auto; }
.lv-section {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  border: 1px solid var(--border);
}
.lv-section-title {
  font-size: 13px; font-weight: 800; color: var(--text);
  margin-bottom: 12px; letter-spacing: -0.2px;
}
.lv-my-section { background: var(--brand-light); border-color: rgba(140,21,21,0.18); }

/* マイコード */
.lv-code-box { display: flex; align-items: center; gap: 10px; }
.lv-code-display {
  flex: 1; font-size: 26px; font-weight: 900; letter-spacing: 4px;
  color: var(--brand); background: var(--bg); border-radius: 12px;
  padding: 12px 16px; text-align: center; border: 2px dashed rgba(140,21,21,0.3);
  font-family: monospace;
}
.lv-copy-btn {
  padding: 10px 18px; background: var(--brand); color: #fff;
  border: none; border-radius: 12px; font-size: 13px; font-weight: 800;
  cursor: pointer; white-space: nowrap; font-family: inherit;
}

/* フレンド追加 */
.lv-add-row { display: flex; gap: 8px; }
.lv-code-input {
  flex: 1; padding: 11px 14px; border: 1.5px solid var(--border);
  border-radius: 12px; font-size: 14px; font-family: inherit; outline: none;
  background: var(--bg); color: var(--text); letter-spacing: 1px;
}
.lv-code-input:focus { border-color: var(--brand); }
.lv-add-btn {
  padding: 11px 20px; background: var(--brand); color: #fff;
  border: none; border-radius: 12px; font-size: 14px; font-weight: 800;
  cursor: pointer; font-family: inherit; white-space: nowrap;
}

/* フレンドカード */
.lv-friend-card {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.lv-friend-card:last-child { border-bottom: none; }
.lv-friend-badge {
  font-size: 10px; font-weight: 800; padding: 3px 8px;
  border-radius: 20px; margin-left: auto; white-space: nowrap; flex-shrink: 0;
}
.lv-badge-now { background: #E8F8EE; color: #1a9645; }
.lv-chat-btn {
  position: relative;
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--brand-light); color: var(--brand);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.15s, transform 0.15s;
}
.lv-chat-btn:active { transform: scale(0.9); }
.lv-chat-btn-unread { background: var(--brand); color: #fff; }
.lv-chat-unread-dot {
  position: absolute; top: -3px; right: -3px;
  background: #e74c3c; color: #fff;
  font-size: 9px; font-weight: 800;
  border-radius: 10px; padding: 1px 4px; min-width: 15px;
  text-align: center; border: 1.5px solid var(--surface);
}
.lv-chat-hint {
  display: flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, #f0f8ff, #e8f4f8);
  border: 1px solid #c8e0f0; border-radius: 10px;
  padding: 9px 12px; margin-bottom: 12px;
  font-size: 12px; color: #2c5f7a; font-weight: 600;
}
.lv-badge-later { background: #FEF6E4; color: #d4870a; }
.lv-badge-off { background: var(--bg); color: var(--muted); }
.lv-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 0; }

/* ステータスボタン (タブ内) */
.lv-status-row { display: flex; gap: 8px; margin-bottom: 10px; }
.lv-status-btn {
  flex: 1; padding: 10px 4px; border-radius: 12px; border: 2px solid var(--border);
  background: var(--surface); font-size: 12px; font-weight: 700; cursor: pointer;
  text-align: center; transition: all 0.15s; font-family: inherit; line-height: 1.3;
}
.lv-status-btn.active-now { border-color: #2ecc71; background: #E8F8EE; color: #1a9645; }
.lv-status-btn.active-later { border-color: #f39c12; background: #FEF6E4; color: #d4870a; }
.lv-status-btn.active-off { border-color: var(--muted); background: var(--bg); color: var(--muted); }

/* ── 自分のステータスカード（sticky） ── */
.lv-my-card {
  position: sticky;
  top: var(--topbar-h); /* トップバー高さ */
  z-index: 50;
  background: var(--grad);
  padding: 12px 16px 14px;
  box-shadow: 0 4px 16px rgba(140,21,21,0.3);
}
.lv-my-card-inner {
  display: flex;
  align-items: center;
  gap: 12px;
}
.lv-my-icon-wrap {
  position: relative;
}
.lv-my-icon {
  width: 46px; height: 46px; border-radius: 50%;
  border: 2.5px solid rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.15);
  font-size: 24px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: transform 0.15s;
}
.lv-my-icon:active { transform: scale(0.9); }
.lv-my-icon-edit {
  position: absolute; bottom: -2px; right: -2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff; color: var(--brand);
  font-size: 9px; font-weight: 900;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--brand); pointer-events: none;
}
.lv-my-info { flex: 1; min-width: 0; }
.lv-my-name {
  font-size: 15px; font-weight: 800; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lv-my-name-sub { font-size: 11px; color: rgba(255,255,255,0.65); }
.lv-my-status-pills {
  display: flex; gap: 8px; margin-top: 14px;
  background: rgba(0,0,0,0.18); border-radius: 14px;
  padding: 8px;
}
.lv-my-pill {
  flex: 1; padding: 11px 4px; border-radius: 10px;
  font-size: 12px; font-weight: 800; cursor: pointer;
  border: none;
  background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.55);
  text-align: center; transition: all 0.18s; font-family: inherit;
  line-height: 1.4; letter-spacing: 0.2px;
}
.lv-my-pill.pill-now        { border: 2px solid rgba(46,204,113,0.35); }
.lv-my-pill.pill-later      { border: 2px solid rgba(243,156,18,0.35); }
.lv-my-pill.pill-off        { border: 2px solid rgba(255,255,255,0.2); }
.lv-my-pill.pill-now.active {
  background: #2ecc71; border-color: #2ecc71; color: #fff;
  box-shadow: 0 3px 12px rgba(46,204,113,0.5);
  transform: scale(1.03);
}
.lv-my-pill.pill-later.active {
  background: #f39c12; border-color: #f39c12; color: #fff;
  box-shadow: 0 3px 12px rgba(243,156,18,0.5);
  transform: scale(1.03);
}
.lv-my-pill.pill-off.active {
  background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.5); color: #fff;
}
.lv-my-nick-row {
  display: flex; gap: 6px; margin-top: 8px;
}
.lv-my-nick-input {
  flex: 1; padding: 8px 12px; border-radius: 10px;
  border: 1.5px solid rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.15); color: #fff;
  font-size: 13px; font-family: inherit; outline: none;
}
.lv-my-nick-input::placeholder { color: rgba(255,255,255,0.5); }
.lv-my-nick-btn {
  padding: 8px 14px; background: #fff; color: var(--brand);
  border: none; border-radius: 10px; font-size: 13px;
  font-weight: 800; cursor: pointer; font-family: inherit; white-space: nowrap;
}

/* ── コード＋追加（sticky card 行②） ── */
.lv-code-add-row {
  display: flex; gap: 8px; align-items: center;
  margin-top: 10px;
}
.lv-code-mini {
  display: flex; align-items: center; gap: 5px;
  background: rgba(255,255,255,0.14); border-radius: 10px;
  padding: 6px 10px; flex: 1; min-width: 0;
  border: 1px solid rgba(255,255,255,0.2);
}
.lv-code-mini-key { font-size: 13px; flex-shrink: 0; }
.lv-code-mini-val {
  font-size: 13px; font-weight: 800; color: #fff;
  letter-spacing: 1px; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.lv-code-mini-copy {
  background: rgba(255,255,255,0.22); color: #fff;
  border: none; border-radius: 7px; font-size: 11px;
  font-weight: 700; padding: 4px 8px; cursor: pointer;
  font-family: inherit; flex-shrink: 0; white-space: nowrap;
}
.lv-add-mini {
  display: flex; align-items: center; gap: 5px;
  flex: 1; min-width: 0;
}
.lv-add-mini-input {
  flex: 1; min-width: 0; padding: 6px 10px;
  background: rgba(255,255,255,0.14); color: #fff;
  border: 1px solid rgba(255,255,255,0.3); border-radius: 10px;
  font-size: 12px; font-family: inherit; outline: none;
  text-transform: uppercase;
}
.lv-add-mini-input::placeholder { color: rgba(255,255,255,0.45); }
.lv-add-mini-btn {
  background: rgba(255,255,255,0.22); color: #fff;
  border: none; border-radius: 10px; font-size: 16px;
  width: 34px; height: 34px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}

/* ── メニューシート ── */
.menu-sheet-header {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--surface); z-index: 1;
}
.menu-sheet-title { font-size: 18px; font-weight: 800; }
.menu-info-row {
  display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap;
}
.menu-info-chip {
  display: flex; align-items: center; gap: 4px;
  background: var(--brand-light); color: var(--brand);
  border-radius: 20px; padding: 4px 10px;
  font-size: 11.5px; font-weight: 700;
}
.menu-cat-title {
  font-size: 12px; font-weight: 800; color: var(--muted);
  letter-spacing: 0.5px; text-transform: uppercase;
  padding: 14px 18px 6px; background: var(--bg);
}
.menu-item-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 18px; border-bottom: 1px solid var(--border);
  gap: 10px;
}
.menu-item-row:last-child { border-bottom: none; }
.menu-item-name { font-size: 14px; font-weight: 600; }
.menu-item-note { font-size: 11px; color: var(--muted); margin-top: 1px; }
.menu-item-price {
  font-size: 14px; font-weight: 800; color: var(--brand);
  flex-shrink: 0; white-space: nowrap;
}

/* ── チャット ── */
.chat-sheet { height: 85vh; display: flex; flex-direction: column; padding: 0 !important; }
.chat-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.chat-header-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.chat-header-name { font-size: 15px; font-weight: 800; flex: 1; }
.chat-header-status { font-size: 12px; color: var(--muted); }
.chat-messages {
  flex: 1; overflow-y: auto; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 8px;
}
.chat-bubble-wrap { display: flex; gap: 8px; align-items: flex-end; }
.chat-bubble-wrap.me { flex-direction: row-reverse; }
.chat-bubble {
  max-width: 72%; padding: 10px 14px; border-radius: 18px;
  font-size: 14px; line-height: 1.45; word-break: break-word;
}
.chat-bubble.them {
  background: var(--surface); border: 1px solid var(--border);
  border-bottom-left-radius: 4px; color: var(--text);
}
.chat-bubble.me {
  background: var(--brand); color: #fff;
  border-bottom-right-radius: 4px;
}
.chat-time { font-size: 10px; color: var(--muted); flex-shrink: 0; margin-bottom: 2px; }
.chat-av-sm {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; color: #fff;
}
.chat-input-bar {
  display: flex; gap: 8px; padding: 10px 14px 14px;
  border-top: 1px solid var(--border); flex-shrink: 0;
  background: var(--surface);
}
.chat-input {
  flex: 1; padding: 10px 14px; border: 1.5px solid var(--border);
  border-radius: 22px; font-size: 14px; font-family: inherit;
  outline: none; background: var(--bg); resize: none;
}
.chat-input:focus { border-color: var(--brand); }
.chat-send-btn {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--brand); color: #fff; border: none;
  font-size: 18px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}

/* アバター行 */
.lv-avatar-row {
  display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.lv-avatar-circle { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.lv-avatar-ring {
  width: 52px; height: 52px; border-radius: 50%; padding: 2.5px;
  display: flex; align-items: center; justify-content: center;
}
.lv-ring-self { background: var(--grad-gold); }
.lv-ring-friend { background: linear-gradient(135deg, #2ecc71, #27ae60); }
.lv-avatar-inner {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800; color: #fff;
}
.lv-avatar-name { font-size: 10px; font-weight: 700; color: var(--sub); max-width: 52px; text-align: center; overflow: hidden; white-space: nowrap; }

/* アイコンピッカーボタン */
.lv-icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--brand);
  background: var(--brand-light); font-size: 22px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s;
}
.lv-icon-btn:active { transform: scale(0.9); }

/* グループラベル */
.lv-group-label { font-size: 11px; font-weight: 800; margin: 10px 0 4px; }

/* セクション小見出し */
.lv-section-label { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: 0.3px; }

/* ── 営業時間曜日エディタ ── */
.hours-day-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.hours-day-row:last-of-type { border-bottom: none; }
.hdr-day { width: 22px; font-size: 13px; font-weight: 800; flex-shrink: 0; color: var(--text); }
.hdr-day.hdr-closed { color: var(--muted); }
.hdr-hours { flex: 1; }
.hdr-input {
  width: 100%; padding: 6px 10px; border: 1.5px solid var(--border);
  border-radius: 8px; font-size: 12px; font-family: inherit; outline: none;
  background: var(--bg);
}
.hdr-input:focus { border-color: var(--brand); }
.hdr-toggle {
  font-size: 11px; font-weight: 700; padding: 5px 10px;
  border: 1.5px solid var(--border); border-radius: 8px;
  background: var(--bg); cursor: pointer; white-space: nowrap;
  font-family: inherit; color: var(--sub);
}
/* 一言テンプレボタン */
.note-tpl-btn {
  font-size: 11px; font-weight: 700; padding: 5px 10px;
  border: 1.5px solid var(--border); border-radius: 20px;
  background: var(--surface); cursor: pointer; font-family: inherit;
  color: var(--sub); white-space: nowrap; transition: all 0.12s;
}
.note-tpl-btn:active { background: var(--brand-light); border-color: var(--brand); color: var(--brand); }

/* ── インスタNotes 一言（店名横インライン） ── */
.post-name-row {
  display: flex; align-items: center; gap: 6px;
  flex-wrap: wrap; min-width: 0;
}
.note-inline {
  display: inline-flex; align-items: center;
  background: var(--brand-light);
  border: 1px solid #e8c8c8;
  border-radius: 20px;
  padding: 2px 8px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--brand);
  white-space: nowrap;
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.5;
  flex-shrink: 1;
}

/* mood customize btn */
.mood-customize-btn {
  flex-shrink: 0;
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer;
  color: var(--muted);
}
/* mood settings sheet */
.mood-setting-row {
  display: flex; align-items: center;
  padding: 13px 18px; border-bottom: 1px solid var(--border);
  gap: 12px;
}
.mood-setting-row:last-child { border-bottom: none; }
.msr-emoji { font-size: 22px; flex-shrink: 0; }
.msr-label { flex: 1; font-size: 14px; font-weight: 600; }
.msr-toggle {
  width: 44px; height: 26px; border-radius: 13px;
  border: none; cursor: pointer; position: relative;
  transition: background 0.2s; flex-shrink: 0;
}
.msr-toggle::after {
  content: ''; position: absolute;
  top: 3px; left: 3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: #fff; transition: transform 0.2s;
}
.msr-toggle.on { background: var(--brand); }
.msr-toggle.on::after { transform: translateX(18px); }
.msr-toggle.off { background: #ccc; }
.msr-order-btns { display: flex; gap: 4px; }
.msr-order-btn {
  width: 26px; height: 26px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg);
  cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}

/* saved story ring */
.story-saved .story-ring {
  background: var(--grad-gold);
}
.story-saved .story-inner {
  font-size: 22px;
}

/* feed filter bar (shows active mood) */
.feed-filter-bar {
  display: none;
  padding: 8px 14px;
  background: #FFF5F5;
  border-bottom: 1px solid var(--border);
  align-items: center;
  gap: 8px;
  font-size: 13px;
}
.feed-filter-bar.visible { display: flex; }
.ffb-label { font-weight: 700; color: var(--brand); flex: 1; }
.ffb-clear { font-size: 12px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 2px 8px; }

/* chips (search tab only) */
.chip {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  color: var(--sub);
  transition: all 0.15s;
  user-select: none;
}
.chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }

.campus-chip {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  color: var(--text);
  transition: all 0.15s;
}
.campus-chip.active {
  background: var(--brand);
  color: #fff;
  border-color: var(--brand);
}

/* ── ACCORDION (search) ── */
.accordion {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 10px;
}
.accordion-hd {
  display: flex; align-items: center;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  gap: 10px;
}
.accordion-hd .ah-icon { font-size: 18px; flex-shrink: 0; }
.accordion-hd .ah-title { font-size: 14px; font-weight: 800; flex: 1; }
.accordion-hd .ah-selected {
  font-size: 11px; font-weight: 700;
  color: var(--brand);
  background: var(--brand-light);
  padding: 3px 9px; border-radius: 10px;
  max-width: 120px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.accordion-hd .ah-arrow {
  font-size: 16px; color: var(--muted);
  transition: transform 0.2s;
}
.accordion.open .ah-arrow { transform: rotate(90deg); }
.accordion-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.28s ease;
}
.accordion.open .accordion-body { max-height: 600px; }
.accordion-inner { padding: 0 14px 14px; }

/* feed */
.feed { max-width: 480px; margin: 0 auto; }

/* post card */
.post {
  background: var(--surface);
  border-bottom: 8px solid var(--bg);
  cursor: pointer;
  transition: opacity 0.15s;
}
.post:active { opacity: 0.8; }
.post-header {
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.post-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--brand-light, #fde8e8);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  border: 1.5px solid var(--border);
}
.post-meta { flex: 1; min-width: 0; }
.post-name { font-size: 14px; font-weight: 700; flex-shrink: 0; }
.post-genre { font-size: 12px; color: var(--muted); }
.post-badge-paid {
  font-size: 10px;
  background: linear-gradient(135deg, #f39c12, #e67e22);
  color: #fff;
  padding: 3px 8px;
  border-radius: 20px;
  font-weight: 700;
}
.post-badge-new {
  font-size: 10px;
  background: var(--grad);
  color: #fff;
  padding: 3px 8px;
  border-radius: 20px;
  font-weight: 700;
}

/* visual */
.post-visual {
  width: 100%;
  aspect-ratio: 1/1;
  background: linear-gradient(145deg, #F7EEEE, #EDE0E0);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 96px;
  position: relative;
  overflow: hidden;
}
.post-visual-bg {
  position: absolute;
  inset: 0;
  font-size: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.07;
}

/* congestion overlay — 超目立つデザイン */
.cong-overlay {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent 0%, rgba(0,0,0,0.72) 100%);
  padding: 48px 14px 14px;
}
.cong-main-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 8px;
}
.cong-big-num {
  font-size: 56px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -2px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.4);
}
.cong-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}
.cong-status-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 800;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1.5px solid rgba(255,255,255,0.3);
}
.cong-live-tag {
  font-size: 10px;
  color: rgba(255,255,255,0.65);
  font-weight: 600;
  letter-spacing: 0.5px;
}
.cong-bar-wrap {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  overflow: hidden;
}
.cong-bar { height: 100%; border-radius: 3px; transition: width 1.2s ease; }

/* actions */
.post-actions {
  padding: 6px 14px 2px;
  display: flex;
  gap: 14px;
  align-items: center;
}
.action-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 22px;
  padding: 0;
  line-height: 1;
  transition: transform 0.15s;
}
.action-btn:active { transform: scale(1.3); }
.action-btn .cnt { font-size: 13px; color: var(--sub); font-weight: 600; }
.spacer { flex: 1; }
.save-btn { font-size: 22px; background: none; border: none; cursor: pointer; }

/* caption */
.post-caption {
  padding: 2px 14px 14px;
}
.caption-name { font-size: 13px; font-weight: 700; display: inline; }
.caption-text { font-size: 13px; color: var(--sub); display: inline; margin-left: 4px; line-height: 1.5; }
.post-meta-row {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-top: 6px;
  flex-wrap: wrap;
}
.meta-chip {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--sub);
  background: var(--bg);
  padding: 3px 9px;
  border-radius: 10px;
}
.meta-chip.price { color: #27ae60; font-weight: 700; }

/* empty */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty-state .e { font-size: 48px; margin-bottom: 10px; }

/* ── SEARCH VIEW ── */
.search-view { max-width: 480px; margin: 0 auto; padding-bottom: 20px; }
.search-sticky {
  position: sticky;
  top: var(--topbar-h);
  z-index: 150;
  background: var(--bg);
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border);
}
.search-box-wrap { position: relative; }
.search-box-wrap input {
  width: 100%;
  padding: 11px 16px 11px 40px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-size: 15px;
  outline: none;
  font-family: inherit;
  transition: border-color 0.15s;
}
.search-box-wrap input:focus { border-color: var(--brand); }
.search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 17px; pointer-events: none; }
.search-clear {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: var(--muted); color: #fff; border: none; border-radius: 50%;
  width: 18px; height: 18px; font-size: 11px; cursor: pointer;
  display: none; align-items: center; justify-content: center;
}
.search-clear.visible { display: flex; }

/* search sections */
.search-sections { padding: 14px 14px 0; }
.search-section-title {
  font-size: 13px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* situation grid */
.situation-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-bottom: 20px;
}
.situation-card {
  background: var(--surface);
  border-radius: 14px;
  padding: 14px 12px;
  display: flex;
  align-items: center;
  gap: 11px;
  cursor: pointer;
  border: 2px solid var(--border);
  transition: all 0.15s;
  text-align: left;
}
.situation-card:active { transform: scale(0.97); }
.situation-card.active { border-color: var(--brand); background: #FFF5F5; }
.situation-card .sit-emoji { font-size: 26px; flex-shrink: 0; }
.situation-card .sit-body {}
.situation-card .sit-label { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.3; }
.situation-card .sit-count { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* person count */
.person-row {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.person-chip {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 16px;
  border-radius: 12px;
  background: var(--surface);
  border: 2px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
  min-width: 64px;
}
.person-chip:active { transform: scale(0.95); }
.person-chip.active { border-color: var(--brand); background: #FFF5F5; }
.person-chip .pc-icon { font-size: 20px; }
.person-chip .pc-label { font-size: 12px; font-weight: 700; color: var(--text); }
.person-chip .pc-seats { font-size: 10px; color: var(--muted); }

/* genre grid */
.genre-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin-bottom: 10px;
}
.genre-tile {
  border-radius: 14px;
  padding: 14px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  cursor: pointer;
  font-size: 28px;
  font-weight: 700;
  transition: transform 0.15s, opacity 0.15s;
  border: none;
}
.genre-tile:active { transform: scale(0.95); }
.genre-tile.active { outline: 3px solid var(--brand); outline-offset: 2px; opacity: 0.85; }
.genre-tile .gl { font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.3); }

/* active filters summary */
.active-filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 8px 14px;
  background: var(--brand-light);
  border-bottom: 1px solid var(--border);
}
.active-filter-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  background: var(--brand);
  color: #fff;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.active-filter-chip .x { opacity: 0.75; font-size: 11px; }

/* ── MAP VIEW ── */
#viewMap { position: relative; }
#mapContainer { height: calc(100vh - var(--topbar-h) - var(--nav-h) - env(safe-area-inset-bottom, 0px)); }

/* ── DETAIL SHEET ── */
.sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 400;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s;
}
.sheet-overlay.open { opacity: 1; pointer-events: all; }
.sheet {
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  width: 100%;
  max-width: 520px;
  max-height: 92vh;
  overflow-y: auto;
  transform: translateY(20px);
  transition: transform 0.22s;
  padding-bottom: 36px;
}
.sheet-overlay.open .sheet { transform: translateY(0); }
.sheet-handle {
  width: 36px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 10px auto 0;
}
.sheet-visual {
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 90px;
  background: linear-gradient(145deg, #fde8e8, #fef3e8);
  position: relative;
  overflow: hidden;
}
.sheet-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 30px;
  height: 30px;
  background: rgba(0,0,0,0.25);
  border: none;
  border-radius: 50%;
  color: #fff;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sheet-body { padding: 16px 18px 0; }
.sheet-genre { font-size: 12px; color: var(--brand); font-weight: 700; margin-bottom: 2px; }
.sheet-name { font-size: 22px; font-weight: 900; margin-bottom: 12px; }

/* congestion in sheet */
.cong-section {
  background: #f8f8f8;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 16px;
}
.cong-sec-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.cong-sec-title { font-size: 13px; font-weight: 700; }
.cong-sec-time { font-size: 11px; color: var(--muted); }
.cong-big-bar { height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden; margin-bottom: 8px; }
.cong-big-fill { height: 100%; border-radius: 5px; transition: width 1s ease, background 1s; }
.cong-big-row { display: flex; justify-content: space-between; align-items: flex-end; }
.cong-big-pct { font-size: 32px; font-weight: 900; line-height: 1; }
.cong-big-status { font-size: 14px; font-weight: 700; margin-top: 2px; }
.cong-scale { font-size: 10px; color: var(--muted); text-align: right; line-height: 1.9; }
.cong-update-btns { display: flex; gap: 7px; margin-top: 12px; }
.cong-upd-btn {
  flex: 1;
  padding: 8px 6px;
  border-radius: 10px;
  border: 2px solid;
  background: transparent;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}
.cong-upd-btn:hover { opacity: 0.75; }

/* PR box */
.pr-box {
  background: linear-gradient(135deg, #FDF6F0, #FFF0F0);
  border-left: 4px solid var(--brand);
  border-radius: 0 12px 12px 0;
  padding: 13px 15px;
  margin-bottom: 16px;
  position: relative;
}
.pr-box .pr-label { font-size: 10px; font-weight: 800; color: var(--brand); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 5px; }
.pr-box .pr-text { font-size: 14px; color: var(--text); line-height: 1.65; }
.pr-box .pr-quote { position: absolute; top: 8px; right: 12px; font-size: 28px; opacity: 0.12; line-height: 1; }

/* capacity block */
.capacity-row {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}
.cap-card {
  flex: 1;
  background: var(--brand);
  color: #fff;
  border-radius: 12px;
  padding: 12px 14px;
  text-align: center;
}
.cap-card .cap-num { font-size: 28px; font-weight: 900; line-height: 1; }
.cap-card .cap-lbl { font-size: 11px; opacity: 0.85; margin-top: 3px; }
.cap-card.alt { background: #F7EEEE; color: var(--brand); }

/* appeals */
.appeals-row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }
.appeal-chip {
  padding: 6px 12px;
  background: #fff;
  border: 1.5px solid var(--brand);
  color: var(--brand);
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
}

.sheet-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.sinfo { background: var(--bg); border-radius: 10px; padding: 10px 12px; }

  font-size: 13px;
  font-weight: 600;

  pointer-events: none;

}

function storeRef(storeId){ return db.collection('stores').doc(String(storeId)); }

// リアルタイムリスナー：全店舗の混雑率＋オーナーデータを監視
let _firestoreListenersStarted = false;
function startFirestoreListeners(){
  if(_firestoreListenersStarted) return;
  _firestoreListenersStarted = true;
  STORES.forEach(s => {
    storeRef(s.id).onSnapshot(doc => {
      if(doc.exists){
        const data = doc.data();
        if(typeof data.congestion === 'number') cong[s.id] = data.congestion;
        if(!ownerData[s.id]) ownerData[s.id] = { waitTime:0, seatsStatus:'normal', todaySpecial:'', customHours:{}, jobs:[], menu:null, likedBy:[] };
        if(data.todaySpecial !== undefined) {
          const today = new Date().toDateString();
          if(!data.todaySpecial || data.todaySpecialDate === today) {
            ownerData[s.id].todaySpecial = data.todaySpecial;
          } else {
            // 日付が変わってたら自動クリア
            ownerData[s.id].todaySpecial = '';
            storeRef(s.id).set({ todaySpecial: '', todaySpecialDate: today }, { merge: true }).catch(()=>{});
          }
        }
        if(data.waitTime     !== undefined) ownerData[s.id].waitTime     = data.waitTime;
        if(data.seatsStatus  !== undefined) ownerData[s.id].seatsStatus  = data.seatsStatus;
        if(data.customHours  !== undefined) ownerData[s.id].customHours  = data.customHours;
        if(data.menu         !== undefined) ownerData[s.id].menu         = data.menu;
        if(data.photoUrl     !== undefined) ownerData[s.id].photoUrl     = data.photoUrl;
        if(data.likedBy      !== undefined) ownerData[s.id].likedBy      = data.likedBy;
        // フィードを再描画（ホームが表示中のとき）
        if(document.getElementById('viewHome')?.classList.contains('active')) renderFeed();
        if(document.getElementById('viewSearch')?.classList.contains('active')) showSearchResults(false);
      }
    }, err => console.warn('Firestore listen error:', err));
  });
}

// 混雑率を Firestore に書き込む
function writeCongestionToFirestore(storeId, value){
  storeRef(storeId).set({ congestion: value }, { merge: true })
    .catch(e => console.warn('write cong error:', e));
}

// オーナーデータを Firestore に書き込む（部分更新）
function writeOwnerDataToFirestore(storeId, data){
  storeRef(storeId).set(data, { merge: true })
    .catch(e => console.warn('write owner error:', e));
}

function renderMoodSettingsList(){
  return moodOrder.map((id, idx) => {
    const m = MOODS.find(x => x.id === id);
    const on = moodEnabled[id];
    return `<div class="mood-setting-row">
      <span class="msr-emoji">${m.emoji}</span>
      <span class="msr-label">${m.label}</span>
      <div class="msr-order-btns">
        <button class="msr-order-btn" onclick="moveMood(${idx},-1)" ${idx===0?'disabled style="opacity:.3"':''}>▲</button>
        <button class="msr-order-btn" onclick="moveMood(${idx},1)" ${idx===moodOrder.length-1?'disabled style="opacity:.3"':''}>▼</button>
      </div>
      <button class="msr-toggle ${on?'on':'off'}" onclick="toggleMoodEnabled('${id}')"></button>
    </div>`;
  }).join('');
}
function toggleMoodEnabled(id){
  moodEnabled[id] = !moodEnabled[id];
  document.getElementById('moodSettingsList').innerHTML = renderMoodSettingsList();
}
function moveMood(idx, dir){
  const newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= moodOrder.length) return;
  [moodOrder[idx], moodOrder[newIdx]] = [moodOrder[newIdx], moodOrder[idx]];
  document.getElementById('moodSettingsList').innerHTML = renderMoodSettingsList();
}
function closeMoodSettings(){
  document.getElementById('moodSettingsOverlay').classList.remove('open');
  document.body.style.overflow = '';
  // 非表示になったムードをアクティブから除外
  activeMoods.forEach(id=>{ if(!moodEnabled[id]) activeMoods.delete(id); });
  renderStories();
  renderFeed();
}

function renderStories(){
  // 保存したお店ストーリー列
  const savedRow = document.getElementById("savedStoriesRow");
  const savedList = STORES.filter(s => saves[s.id]);
  if(savedRow){
    if(savedList.length > 0 && activeMoods.size === 0){
      savedRow.style.display = "flex";
      savedRow.innerHTML =
        `<div class="story story-saved" style="padding-right:2px">
          <div class="story-ring" style="background:linear-gradient(135deg,#C9A84C,#8C1515)">
            <div class="story-inner" style="font-size:16px;font-weight:800;color:var(--brand)">🔖</div>
          </div>
          <span class="story-label" style="font-weight:700;color:var(--brand)">保存済み</span>
        </div>` +
        savedList.map(s => `
          <div class="story" onclick="openDetail(${s.id})">
            <div class="story-ring" style="background:var(--grad-gold)">
              <div class="story-inner">${s.emoji}</div>
            </div>
            <span class="story-label">${s.name.length>5?s.name.slice(0,5)+'…':s.name}</span>
          </div>`).join("");
    } else {
      savedRow.style.display = "none";
    }
  }

  // ムードチップ列（カスタム順・有効のみ）
  const moodRow = document.getElementById("moodRow");
  if(moodRow){
    const visibleMoods = moodOrder.filter(id => moodEnabled[id]).map(id => MOODS.find(x=>x.id===id));
    moodRow.innerHTML = visibleMoods.map(m => {
      const cnt = STORES.filter(s => m.match(s)).length;
      const on  = activeMoods.has(m.id);
      return `<button class="mood-chip${on?' active':''}" onclick="setMood('${m.id}')">${m.emoji} ${m.label}<span style="font-size:11px;opacity:0.7;margin-left:3px">${cnt}</span></button>`;
    }).join("");
  }
}

function setMood(id){
  if(activeMoods.has(id)) activeMoods.delete(id);
  else { activeMoods.add(id); logEvent('mood_filter', { mood: id }); }
  renderStories();
  renderFeed();
  const bar = document.getElementById("feedFilterBar");
  const lbl = document.getElementById("feedFilterLabel");
  if(activeMoods.size > 0){
    const labels = [...activeMoods].map(mid=>{ const m=MOODS.find(x=>x.id===mid); return m?m.emoji+m.label:''; }).join(' · ');
    lbl.textContent = labels;
    bar.classList.add("visible");
  } else {
    bar.classList.remove("visible");
  }
}

function filteredStores(q=""){
  return STORES.filter(s=>{
    if(q && !s.name.includes(q) && !s.genre.includes(q) && !s.desc.includes(q) &&
       !s.tags.some(t=>t.includes(q)) && !s.appeals.some(a=>a.includes(q))) return false;
    if(activeMoods.size>0){
      const anyMatch = [...activeMoods].every(mid=>{ const m=MOODS.find(x=>x.id===mid); return m&&m.match(s); });
      if(!anyMatch) return false;
    }
    return true;
  });
}

  const list=filteredStores().slice().sort((a,b)=>(PLAN_ORDER[a.plan]||2)-(PLAN_ORDER[b.plan]||2));

    el.innerHTML=`<div class="empty-state"><div class="e">🍽️</div><p>該当なし</p></div>`;

  list.forEach((s,i)=>{

function toggleLike(id){
  logEvent('store_like', { store_id: id, store_name: STORES.find(s=>s.id===id)?.name });
  if(likedByUser.has(id)){
    likedByUser.delete(id);
    likes[id] = Math.max(0, likes[id]-1);
  } else {
    likedByUser.add(id);
    likes[id]++;
  }
  const btn=document.getElementById("heart-"+id);
  const isLiked = likedByUser.has(id);
  if(btn){ btn.classList.add("liked"); setTimeout(()=>btn.classList.remove("liked"),400); btn.innerHTML=`${isLiked?'❤️':'🤍'} <span class="cnt">${likes[id]}</span>`; }

  // Firestoreの likedBy フィールドにも保存
  if(isLiked){
    myLikes.add(id);
    storeRef(id).set({ likedBy: firebase.firestore.FieldValue.arrayUnion(myCode) }, { merge: true }).catch(()=>{});
    showToast('❤️ いいねしました');
  } else {
    myLikes.delete(id);
    storeRef(id).set({ likedBy: firebase.firestore.FieldValue.arrayRemove(myCode) }, { merge: true }).catch(()=>{});
    showToast('いいねを取り消しました');
  }
  localStorage.setItem('waseMeshiLikes', JSON.stringify([...myLikes]));
  // 詳細シートが開いていれば likes ボタンを更新
  const detailLikeBtn = document.getElementById('detail-like-btn-'+id);
  if(detailLikeBtn){
    const _fns = friendLikeNames(id).filter(n=>n!=='自分');
    detailLikeBtn.innerHTML = `${myLikes.has(id)?'❤️':'🤍'} いいね${_fns.length>0?` <span style="font-size:11px;opacity:0.8">・${_fns.join('、')}もいいね</span>`:''}`;
  }
}

function friendLikeCount(storeId){
  const liked = ownerData[storeId]?.likedBy || [];
  return liked.filter(code => code === myCode || friendsList.some(f=>f.code===code)).length;
}
function friendLikeNames(storeId){
  const liked = ownerData[storeId]?.likedBy || [];
  const names = [];
  if(liked.includes(myCode)) names.push('自分');
  friendsList.forEach(f=>{ if(liked.includes(f.code)) names.push(f.name); });
  return names;
}

async function loadFriendComments(storeId){
  const snap = await db.collection('stores').doc(String(storeId)).collection('comments')
    .limit(50).get();
  // クライアント側でソート（Firestoreインデックス不要）
  const allComments = snap.docs.map(d=>({id:d.id,...d.data()}))
    .sort((a,b)=>(b.timestamp?.seconds||0)-(a.timestamp?.seconds||0));
  const friendCodes = new Set([myCode, ...friendsList.map(f=>f.code)]);
  return allComments.filter(c=>friendCodes.has(c.code));
}

async function renderCommentSection(storeId){
  const el = document.getElementById('commentSection');
  if(!el) return;
  try {
    const comments = await loadFriendComments(storeId);

          </div>
        </div>
      `).join('');
  } catch(e) {

    el.innerHTML = '<div style="font-size:13px;color:var(--muted);text-align:center;padding:12px">コメントを読み込めませんでした</div>';

async function postComment(storeId){
  const inp = document.getElementById('commentInput');
  if(!inp) return;
  const text = inp.value.trim();
  if(!text) return;
  if(text.length > 100){ showToast('100文字以内で'); return; }
  inp.value = '';
  inp.disabled = true;
  try {
    await db.collection('stores').doc(String(storeId)).collection('comments').add({
      code: myCode,
      name: myLunchName || myCode,
      icon: myLunchIcon || '🍱',
      text,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });

  toyama: { lat: 35.7056042, lng: 139.7176332, name: '戸山キャンパス' },

function distKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function searchFiltered(){
  const q = document.getElementById("searchInput").value.toLowerCase().trim();
  return STORES.filter(s => {
    if(q && !s.name.includes(q) && !s.genre.includes(q) && !s.desc.includes(q) &&
       !s.tags.some(t=>t.includes(q)) && !s.appeals.some(a=>a.includes(q))) return false;
    if(activeSituation){
      const sit = SITUATIONS.find(x=>x.id===activeSituation);
      if(sit && !sit.match(s)) return false;
    }
    if(activePerson){
      const po = PERSON_OPTS.find(x=>x.id===activePerson);
      if(po && s.maxGroup < po.min) return false;
    }
    if(activeSearchGenre && s.genre !== activeSearchGenre) return false;
    if(activeCampus) {
      const c = CAMPUS_CENTERS[activeCampus];
      if(distKm(s.lat, s.lng, c.lat, c.lng) > 0.3) return false;
    }
    return true;
  });
}

function showHoursDetail(storeId){
  const s = STORES.find(x=>x.id===storeId);
  const DAYS = ['月','火','水','木','金','土','日'];
  const closedMap = {
    '日曜定休':[6], '月曜定休':[0], '火曜定休':[1], '水曜定休':[2], '木曜定休':[3],
    '土曜定休':[5], '土日定休':[5,6], '無休':[], '年中無休':[]
  };
  const closedDays = closedMap[s.closed] ?? [];
  const todayIdx = (new Date().getDay() + 6) % 7; // 月=0

  const customH = ownerData[storeId]?.customHours || {};
  const rows = DAYS.map((d,i) => {
    const isToday = i === todayIdx;
    const isCustomClosed = customH[i] === false;
    const isDefaultClosed = closedDays.includes(i);
    const isClosed = isCustomClosed || isDefaultClosed;
    const hoursText = typeof customH[i] === 'string' ? customH[i] : s.hours;
    const hasCustom = customH[i] !== undefined && customH[i] !== null;
    return `<div style="display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);${isToday?'background:var(--brand-light);margin:0 -18px;padding:10px 18px':''}">

      ${isToday?'<span style="font-size:10px;background:var(--brand);color:#fff;padding:2px 6px;border-radius:4px;margin-right:8px;font-weight:700">今日</span>':'<span style="width:44px"></span>'}
      <span style="flex:1;font-size:14px;font-weight:${isToday?'800':'500'};color:${isClosed?'var(--muted)':'var(--text)'}">${isClosed?'定休日':hoursText}</span>
      ${hasCustom?'<span style="font-size:10px;background:#E8F8EE;color:#1a9645;padding:2px 6px;border-radius:4px;font-weight:700">変更済</span>':''}
    </div>`;
  }).join('');

  document.getElementById('hoursSheet').innerHTML = `
    <div class="sheet-handle"></div>
    <div style="padding:16px 18px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
        <span style="font-size:28px">${s.emoji}</span>
        <div>
          <div style="font-size:16px;font-weight:900">${s.name}</div>
          <div style="font-size:12px;color:var(--muted)">営業時間</div>
        </div>
        <button onclick="closeSheets()" style="margin-left:auto;background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted)">✕</button>
      </div>
      ${rows}
      <div style="margin-top:12px;padding:10px 14px;background:var(--bg);border-radius:10px;font-size:12px;color:var(--muted)">
        定休日: ${s.closed}
      </div>
    </div>
  `;
  document.getElementById('hoursOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom:19
  }).addTo(map);

  // ── 早稲田大学キャンパスマーカー ──────────────────────────
  const campuses = [
    { name:'早稲田キャンパス', lat:35.7089, lng:139.7195, color:'#8C1515', note:'文・法・商・政経 など' },
    { name:'戸山キャンパス',   lat:35.7056042, lng:139.7176332, color:'#1f5f9c', note:'文学部・文化構想学部' },
    { name:'西早稲田キャンパス', lat:35.70611,   lng:139.7070,    color:'#0f8a6c', note:'理工学部（基幹・創造・先進）' },
  ];
  campuses.forEach(c => {
    const svgHtml = `<div style="background:${c.color};color:#fff;font-size:10px;font-weight:800;padding:4px 7px;border-radius:12px;white-space:nowrap;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.3)">🎓 ${c.name}</div>`;
    const icon = L.divIcon({ html:svgHtml, className:'', iconAnchor:[0,0] });
    L.marker([c.lat, c.lng], { icon, zIndexOffset:1000 })
      .addTo(map)
      .bindPopup(`<b>🎓 ${c.name}</b><br><span style="font-size:12px;color:#666">${c.note}</span>`);
    // キャンパス中心を示す円
    L.circle([c.lat, c.lng], { radius:120, color:c.color, fillColor:c.color, fillOpacity:0.12, weight:2, opacity:0.55 }).addTo(map);
  });

  STORES.forEach(s=>addMapMarker(s));
}

function mapSearchStores(q) {
  const suggest = document.getElementById('mapSuggest');
  if (!map) return;
  const trimmed = q.trim();
  if (!trimmed) {
    Object.values(mMarkers).forEach(m => m.setOpacity(1));
    if (suggest) suggest.innerHTML = '';
    return;
  }
  const matched = STORES.filter(s =>
    s.name.includes(trimmed) || s.genre.includes(trimmed)
  );
  // 候補リスト描画
  if (suggest) {
    suggest.innerHTML = matched.slice(0, 6).map(s => `
      <div onclick="mapFlyTo(${s.id})" style="padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:8px">
        <span>${s.emoji}</span><span>${s.name}</span><span style="color:#999;font-size:11px;font-weight:400">${s.genre}</span>
      </div>
    `).join('') || '<div style="padding:10px 14px;font-size:12px;color:#999">見つかりませんでした</div>';
  }
  // マーカーの透明度
  Object.values(mMarkers).forEach(m => m.setOpacity(0.2));
  matched.forEach(s => { if (mMarkers[s.id]) mMarkers[s.id].setOpacity(1); });
}

function mapFlyTo(storeId) {
  const s = STORES.find(x => x.id === storeId);
  if (!s || !map) return;
  document.getElementById('mapSuggest').innerHTML = '';
  document.getElementById('mapSearchInput').value = s.name;
  Object.values(mMarkers).forEach(m => m.setOpacity(0.2));
  if (mMarkers[storeId]) mMarkers[storeId].setOpacity(1);
  map.flyTo([s.lat, s.lng], 17, { duration: 0.8 });
  setTimeout(() => mMarkers[storeId]?.openPopup(), 900);
}

function markerSVG(p){
  const c=cColor(p);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="44" viewBox="0 0 36 44">
    <ellipse cx="18" cy="41" rx="7" ry="3" fill="rgba(0,0,0,0.18)"/>
    <path d="M18 0C8.6 0 1 7.6 1 17c0 11.5 17 27 17 27S35 28.5 35 17C35 7.6 27.4 0 18 0z" fill="${c}"/>
    <circle cx="18" cy="17" r="10" fill="white" opacity="0.92"/>
    <text x="18" y="21" text-anchor="middle" font-size="10" font-family="sans-serif" fill="${c}" font-weight="800">${p}%</text>
  </svg>`;
}

function addMapMarker(s){
  const p=cong[s.id];
  const icon=L.divIcon({html:markerSVG(p),iconSize:[36,44],iconAnchor:[18,44],popupAnchor:[0,-44],className:""});
  const m=L.marker([s.lat,s.lng],{icon}).addTo(map);
  m.bindPopup(popupHTML(s));
  mMarkers[s.id]=m;
}

function popupHTML(s){
  const p=cong[s.id];
  return `<div class="mpop"><div class="me">${s.emoji}</div><div class="mn">${s.name}</div><div class="mg">${s.genre}</div><div class="mc">${cEmoji(p)} ${p}% ${cLabel(p)}</div><button onclick="openDetail(${s.id})">詳細を見る</button></div>`;
}

function updateMapMarkers(){
  if(!map) return;
  STORES.forEach(s=>{
    const m=mMarkers[s.id];
    if(!m) return;
    m.setIcon(L.divIcon({html:markerSVG(cong[s.id]),iconSize:[36,44],iconAnchor:[18,44],popupAnchor:[0,-44],className:""}));
    m.setPopupContent(popupHTML(s));
  });
}

// セッションごとにランダムコード生成 or localStorage から復元
function generateCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for(let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
let myCode = (()=>{
  let c = localStorage.getItem('waseMeshiCode');
  if(!c){ c = generateCode(); localStorage.setItem('waseMeshiCode', c); }
  return c;
})();

function saveLunchName(){
  const v = (document.getElementById('lvNameInput')||{}).value||'';

  localStorage.setItem('waseMeshiName', myLunchName);
  renderLunchTab();
  // Firestore にユーザー登録
  db.collection('users').doc(myCode).set({
    name: myLunchName,
    icon: myLunchIcon,
    status: myLunchStatus,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).catch(e => console.warn(e));
}

function resetLunchName(){
  myLunchName = '';
  localStorage.removeItem('waseMeshiName');
  renderLunchTab();
}

let myStatusExpireAt = null;
let myStatusTimerId  = null;

function setLunchStatus(status){
  if(!myLunchName){ showToast(t('lunchToastNeedName')); return; }
  logEvent('mate_status_set', { status: status||'off' });
  myLunchStatus = status;
  // 30分タイマー
  if(myStatusTimerId){ clearInterval(myStatusTimerId); myStatusTimerId=null; }
  if(status){
    myStatusExpireAt = Date.now() + 30*60*1000;
    myStatusTimerId = setInterval(_tickStatusTimer, 60000);
  } else {
    myStatusExpireAt = null;
  }
  const btn = document.getElementById('lunchmateBadgeBtn');
  if(btn) btn.style.display = myLunchStatus ? 'flex' : 'none';
  renderLunchTab();
  showToast(status==='now'?t('lunchToastNow'):status==='later'?t('lunchToastLater'):t('lunchToastPrivate'));
  if(myLunchName){
    db.collection('users').doc(myCode).set({
      status: myLunchStatus,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch(e => console.warn(e));
  }
}

function _tickStatusTimer(){

}

function _statusRemainMin(){
  if(!myStatusExpireAt) return null;
  return Math.max(0, Math.ceil((myStatusExpireAt - Date.now())/60000));

function addFriend(){
  const input = document.getElementById('lvFriendCodeInput');
  if(!input) return;
  const code = input.value.trim().toUpperCase();
  if(!code){ showToast(t('lunchToastNeedCode')); return; }
  if(code === myCode){ showToast(t('lunchToastSelf')); return; }
  if(friendsList.some(f=>f.code===code)){ showToast(t('lunchToastAlready')); return; }
  input.value = '';

  // まず DEMO_FRIENDS をチェック
  if(DEMO_FRIENDS[code]){
    const d = DEMO_FRIENDS[code];
    friendsList.push({ code, name:d.name, dept:d.dept, status:d.status, color:d.color, icon: d.name[0] });
    saveFriends();
    showToast(`🎉 ${d.name} ${t('lunchToastAdded')}`);
    renderLunchTab();
    startFriendListener(code);
    return;
  }

  // Firestore から検索
  showToast(lang==='en'?'🔍 Searching...':'🔍 検索中...');
  db.collection('users').doc(code).get().then(doc => {
    if(doc.exists){
      const d = doc.data();
      // フレンドリクエストをFirestoreに送信（相手に通知）
      const reqData = {
        fromCode: myCode,
        fromName: myLunchName || myCode,
        fromIcon: myLunchIcon || '🍱',
        fromStatus: myLunchStatus || null,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      };
      db.collection('users').doc(code).set(
        { pendingRequests: firebase.firestore.FieldValue.arrayUnion(reqData) },
        { merge: true }
      ).catch(() => {});
      const color = ['#2980b9','#27ae60','#8e44ad','#e67e22','#16a085','#c0392b'][Math.floor(Math.random()*6)];
      const friendName = d.name || `ユーザー(${code})`;
      const friendIcon = d.icon || friendName[0] || '👤';
      friendsList.push({ code, name: friendName, dept:'', status: d.status||null, color, icon: friendIcon });
      saveFriends();
      showToast(`🎉 ${friendName} ${t('lunchToastAdded')}`);
      renderLunchTab();
      startFriendListener(code);
    } else {
      showToast(lang==='en'?'❌ Code not found. Ask your friend to open the app first!':'❌ コードが見つかりません。友達先にアプリを開いて「ランチ」タブを表示してもらってください');
    }
  }).catch(e => {
    console.warn('addFriend error:', e);
    if(e.code === 'permission-denied') {
      showToast('⚠️ Firestoreのセキュリティルールを確認してください');
    } else {
      showToast(lang==='en'?'❌ Connection error. Check your internet.':'❌ 接続エラー。ネットを確認してください');
    }
  });
}

// フレンドごとのリスナー管理
const _friendListeners = {};

function startFriendListener(code){
  if(_friendListeners[code]) return; // 重複防止
  // DEMO_FRIENDSはFirestoreにいないのでスキップ
  if(DEMO_FRIENDS[code]) return;
  _friendListeners[code] = db.collection('users').doc(code).onSnapshot(doc => {
    if(!doc.exists) return;
    const data = doc.data();
    const idx = friendsList.findIndex(f=>f.code===code);
    if(idx === -1) return;
    if(data.name)   friendsList[idx].name   = data.name;
    if(data.icon)   friendsList[idx].icon   = data.icon;
    if(data.status !== undefined) friendsList[idx].status = data.status;
    saveFriends();
    if(document.getElementById('viewLunch')?.classList.contains('active')) renderLunchTab();
  }, e => console.warn('friend listener error:', e));
}

function startAllFriendListeners(){
  friendsList.forEach(f => startFriendListener(f.code));
}

function chatId(codeA, codeB){
  return [codeA, codeB].sort().join('_');
}

function removeFriend(code){
  friendsList = friendsList.filter(f=>f.code!==code);

}

function toggleReactionPicker(idx) {
  const picker = document.getElementById('rp-' + idx);
  if (!picker) return;
  const isVisible = picker.style.display === 'flex';
  document.querySelectorAll('.reaction-picker').forEach(p => p.style.display = 'none');
  picker.style.display = isVisible ? 'none' : 'flex';
}

function addReaction(idx, code, emoji) {
  document.querySelectorAll('.reaction-picker').forEach(p => p.style.display = 'none');
  if (!chatLogs[code]) return;
  const msg = chatLogs[code][idx];
  if (!msg) return;
  if (!msg.reactions) msg.reactions = {};
  if (!msg.reactions[emoji]) msg.reactions[emoji] = [];
  const who = 'me';
  const pos = msg.reactions[emoji].indexOf(who);
  if (pos >= 0) {
    msg.reactions[emoji].splice(pos, 1);
  } else {
    msg.reactions[emoji].push(who);
  }
  saveChats();
  renderChatMessages(code);
}

function toggleReaction(idx, code, emoji) {
  addReaction(idx, code, emoji);
}

async function requestNotifPermission(){
  if(typeof Notification === 'undefined') return;
  if(Notification.permission === 'default'){
    const result = await Notification.requestPermission();
    console.log('通知許可:', result);
  }
}

function pushChatNotif(fromCode, text) {
  const f = friendsList.find(x => x.code === fromCode);
  const name = f?.name || fromCode;
  const icon = f?.icon || '🍚';

  // バイブレーション（モバイル）
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

  // Service Worker経由の通知（バックグラウンドでも届く）
  if ('serviceWorker' in navigator && Notification.permission === 'granted') {
    navigator.serviceWorker.ready.then(reg => {
      reg.showNotification(`${icon} ${name}`, {
        body: text,
        icon: '/icon-192.png',
        badge: '/icon-192.png',
        tag: 'wasemeshi-chat-' + fromCode,
        renotify: true,
        data: { fromCode },
      }).catch(() => {
        // fallback to basic Notification
        try { new Notification(`${icon} ${name}`, { body: text, tag: 'wasemeshi-chat-' + fromCode }); } catch(e) {}
      });
    });
  } else if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
    try { new Notification(`${icon} ${name}`, { body: text, icon: '/icon-192.png', tag: 'wasemeshi-chat-' + fromCode, renotify: true }); } catch(e) {}
  }

  // アプリ内バナートースト
  showToast(`💬 ${name}: ${text.length > 20 ? text.slice(0, 20) + '…' : text}`);
  updateUnreadBadge();
}

function updateUnreadBadge() {
  const chatUnread = friendsList.reduce((sum, f) => {
    return sum + (chatLogs[f.code]||[]).filter(m => m.from==='them' && !m.read).length;
  }, 0);
  const reqCount = (pendingFriendRequests||[]).filter(r =>
    !friendsList.some(f=>f.code===r.fromCode) && r.fromCode !== myCode
  ).length;
  const total = chatUnread + reqCount;
  const nav = document.getElementById('navLunch');
  if (!nav) return;
  let badge = document.getElementById('lunchUnreadBadge');
  if (total > 0) {
    if (!badge) {
      badge = document.createElement('span');
      badge.id = 'lunchUnreadBadge';
      badge.style.cssText = 'position:absolute;top:4px;right:8px;background:#e74c3c;color:#fff;border-radius:10px;font-size:10px;font-weight:800;padding:1px 5px;min-width:16px;text-align:center;line-height:16px';
      nav.style.position = 'relative';
      nav.appendChild(badge);
    }
    badge.textContent = total > 9 ? '9+' : total;
  } else {
    badge?.remove();
  }
}

function sendQuickMsg(text) {

  if (input) input.value = text;

function sendChatMsg(){
  const input = document.getElementById('chatInput');
  if(!input || !currentChatCode) return;
  const text = input.value.trim();
  if(!text) return;
  input.value = '';

  const now = new Date();
  const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

  // ローカルにも追加（即時表示用）
  if(!chatLogs[currentChatCode]) chatLogs[currentChatCode] = [];
  chatLogs[currentChatCode].push({ from:'me', text, time:timeStr, read:true });
  saveChats();
  renderChatMessages(currentChatCode);

  // DEMOフレンドはFirestoreに書かない
  if(DEMO_FRIENDS[currentChatCode]){
    const replies = DEMO_REPLIES_MAP[currentChatCode];
    if(replies && Math.random() < 0.8){
      const delay = 1200 + Math.random()*2000;
      const targetCode = currentChatCode;
      setTimeout(()=>{
        const reply = replies[Math.floor(Math.random()*replies.length)];
        const t2 = new Date();
        const ts = `${t2.getHours()}:${String(t2.getMinutes()).padStart(2,'0')}`;
        if(!chatLogs[targetCode]) chatLogs[targetCode] = [];
        const isChatOpen = currentChatCode === targetCode && document.getElementById('chatOverlay')?.classList.contains('open');
        chatLogs[targetCode].push({ from:'them', text:reply, time:ts, read: isChatOpen });
        saveChats();
        if(isChatOpen){ renderChatMessages(targetCode); }
        else { pushChatNotif(targetCode, reply); if(document.getElementById('viewLunch')?.classList.contains('active')) renderLunchTab(); }
      }, delay);
    }
    return;
  }

  // 本物フレンド → Firestore に書き込み
  const cid = chatId(myCode, currentChatCode);
  db.collection('chats').doc(cid).collection('messages').add({
    from: myCode,
    text,
    time: firebase.firestore.FieldValue.serverTimestamp(),
    read: false
  }).catch(e => console.warn('chat send error:', e));
}

let pendingFriendRequests = [];

function startRequestListener() {
  db.collection('users').doc(myCode).onSnapshot(doc => {
    if (!doc.exists) return;
    const data = doc.data();
    const reqs = data.pendingRequests || [];
    // グローバルに保持してrenderLunchTabで表示
    pendingFriendRequests = reqs.filter(r =>
      !friendsList.some(f => f.code === r.fromCode) && r.fromCode !== myCode
    );
    if (pendingFriendRequests.length > 0) {
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      // メイトタブに未読バッジ
      updateUnreadBadge();
    }
    // メイトタブが表示中なら即時更新
    if (document.getElementById('viewLunch')?.classList.contains('active')) {
      renderLunchTab();
    }
  }, () => {});
}

function acceptFriendRequest(fromCode, fromName, fromIcon) {
  if (!friendsList.some(f => f.code === fromCode)) {
    const color = ['#2980b9','#27ae60','#8e44ad','#e67e22','#16a085','#c0392b'][Math.floor(Math.random()*6)];
    friendsList.push({ code: fromCode, name: fromName, dept: '', status: null, color, icon: fromIcon });
    saveFriends();
    startFriendListener(fromCode);
    showToast(`🎉 ${fromName} とフレンドになりました！`);
  }
  pendingFriendRequests = pendingFriendRequests.filter(r => r.fromCode !== fromCode);
  _clearFriendRequest(fromCode);
  renderLunchTab();
}

function declineFriendRequest(fromCode) {
  pendingFriendRequests = pendingFriendRequests.filter(r => r.fromCode !== fromCode);
  _clearFriendRequest(fromCode);
  renderLunchTab();
}

function _clearFriendRequest(fromCode) {
  // FirestoreのpendingRequestsから削除
  db.collection('users').doc(myCode).get().then(doc => {
    if (!doc.exists) return;
    const reqs = (doc.data().pendingRequests || []).filter(r => r.fromCode !== fromCode);
    db.collection('users').doc(myCode).set({ pendingRequests: reqs }, { merge: true });
  }).catch(() => {});
}

// ── 営業時間チェック ───────────────────────────────────────────
function isStoreOpenNow(store) {
  if (!store || !store.hours) return true; // 不明なら開いてるとみなす
  const m = store.hours.match(/(\d{1,2}):(\d{2})[〜~\-](\d{1,2}):(\d{2})/);
  if (!m) return true;
  const now = new Date();
  const cur = now.getHours() * 60 + now.getMinutes();
  const open  = parseInt(m[1]) * 60 + parseInt(m[2]);
  const close = parseInt(m[3]) * 60 + parseInt(m[4]);
  return cur >= open && cur < close;
}

// ── FCM初期化・トークン取得 ───────────────────────────────────
// ※ VAPIDキーはFirebaseコンソール > プロジェクト設定 > Cloud Messaging > ウェブプッシュ証明書 から取得
const FCM_VAPID_KEY = 'YOUR_VAPID_KEY_HERE'; // ← Firebaseコンソールで置き換え

let _messaging = null;
function _getMessaging() {
  if (_messaging) return _messaging;
  try { _messaging = firebase.messaging(); } catch(e) {}
  return _messaging;
}

async function initOwnerFCM(storeId) {
  if (!('Notification' in window)) return;
  try {
    // 通知許可リクエスト
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return;

    // Service Worker登録（firebase-messaging-sw.js）
    if (!('serviceWorker' in navigator)) return;
    const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');

    // FCMトークン取得（VAPIDキーが設定されている場合のみ）
    if (FCM_VAPID_KEY === 'YOUR_VAPID_KEY_HERE') return;
    const msg = _getMessaging();
    if (!msg) return;
    const token = await msg.getToken({ vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg });
    if (token && storeId) {
      // FirestoreにFCMトークンを保存（将来のサーバー側通知送信に使用）
      db.collection('stores').doc(String(storeId))
        .set({ fcmToken: token, fcmUpdatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true })
        .catch(() => {});
    }
  } catch(e) {
    // サイレントに処理
  }
}

// ── オーナー向け通知スケジュール ─────────────────────────────
function scheduleOwnerNotifs(store) {
  if (!store) return;

  // FCM初期化（通知許可リクエスト含む）
  initOwnerFCM(store.id);

  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  if (!('serviceWorker' in navigator)) return;

  const now   = new Date();
  const today = (hh, mm) => { const d = new Date(); d.setHours(hh, mm, 0, 0); return d; };
  const sendNotif = (title, body) => {
    navigator.serviceWorker.ready.then(reg => {
      reg.showNotification(title, {
        body,
        icon: '/icon-192.png',
        badge: '/icon-192.png',
        tag: 'wasemeshi-owner-' + Date.now(),
        renotify: true,
      });
    }).catch(() => {});
  };

  const tasks = [];

  // 開店30分前
  if (store.hours) {
    const m = store.hours.match(/(\d{1,2}):(\d{2})/);
    if (m) {
      const openTime = today(parseInt(m[1]), parseInt(m[2]));
      const pre30 = new Date(openTime.getTime() - 30 * 60000);
      tasks.push({ time: pre30, title: '🍽 混雑率の更新をお忘れなく', body: `「${store.name}」開店30分前です` });
    }
  }
  tasks.push({ time: today(11, 30), title: '🍽 混雑率の更新をお忘れなく', body: 'ランチタイムです！現在の混雑状況を更新してください' });
  tasks.push({ time: today(17, 30), title: '🍽 混雑率の更新をお忘れなく', body: 'ディナータイムです！現在の混雑状況を更新してください' });

  tasks.forEach(({ time, title, body }) => {
    const diff = time.getTime() - now.getTime();
    if (diff <= 0) return;
    setTimeout(() => sendNotif(title, body), diff);
  });
}

function ownerSetCong(id, pct) {
  cong[id] = pct;
  const now = new Date();
  lastUpd[id] = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  writeCongestionToFirestore(id, pct);
  renderOwnerDash();
  renderFeed();
  updateMapMarkers();
  showToast('✅ 混雑情報を更新しました');
}

function ownerSetWait(w) {
  ownerData[ownerStoreId].waitTime = w;
  writeOwnerDataToFirestore(ownerStoreId, { waitTime: ownerData[ownerStoreId].waitTime, seatsStatus: ownerData[ownerStoreId].seatsStatus });
  renderOwnerDash();
  showToast(`⏱ 待ち時間を「${w===0?'待ちなし':w+'分'}」に更新しました`);
}

function ownerSetSeats(status) {
  ownerData[ownerStoreId].seatsStatus = status;
  writeOwnerDataToFirestore(ownerStoreId, { waitTime: ownerData[ownerStoreId].waitTime, seatsStatus: ownerData[ownerStoreId].seatsStatus });
  renderOwnerDash();
  const labels = {normal:'余裕あり', few:'残り少ない', full:'満席', closed:'本日休業'};
  showToast(`💺 残席を「${labels[status]}」に更新しました`);
}

let _specialSaveTimer = null;
function ownerSetSpecial(val) {
  ownerData[ownerStoreId].todaySpecial = val;
  const cc = document.getElementById('noteCharCount');
  if(cc) cc.textContent = `${val.length}/40`;
  // ライブプレビュー（保存前から即時反映）
  const preview = document.getElementById('todaySpecialPreview');
  if(preview) {
    preview.style.display = val ? '' : 'none';
    preview.textContent = val;
  }
  // デバウンス：タイピング中はFirestore保存せず、止まってから1秒後に保存
  clearTimeout(_specialSaveTimer);
  _specialSaveTimer = setTimeout(() => {
    const today = new Date().toDateString();
    writeOwnerDataToFirestore(ownerStoreId, { todaySpecial: val, todaySpecialDate: today });
    renderFeed();
    showToast(val ? '💬 一言を保存しました' : '✅ 一言を削除しました');
  }, 1000);
}

function ownerInsertNote(text){
  ownerData[ownerStoreId].todaySpecial = text;
  const today = new Date().toDateString();
  writeOwnerDataToFirestore(ownerStoreId, { todaySpecial: text, todaySpecialDate: today });
  const inp = document.getElementById('todaySpecialInput');
  if(inp) inp.value = text;
  const cc = document.getElementById('noteCharCount');
  if(cc) cc.textContent = `${text.length}/40`;
  renderOwnerDash();
  renderFeed();
  showToast(text ? '📝 一言を設定しました' : '✅ 一言を削除しました');
}

function ownerSetDayHours(dayIdx, val){
  if(!ownerData[ownerStoreId].customHours) ownerData[ownerStoreId].customHours = {};
  ownerData[ownerStoreId].customHours[dayIdx] = val;
  writeOwnerDataToFirestore(ownerStoreId, { customHours: ownerData[ownerStoreId].customHours });
  showToast('✅ 営業時間を更新しました');
}

function ownerToggleDayClosed(dayIdx){
  if(!ownerData[ownerStoreId].customHours) ownerData[ownerStoreId].customHours = {};
  const current = ownerData[ownerStoreId].customHours[dayIdx];
  ownerData[ownerStoreId].customHours[dayIdx] = current === false ? undefined : false;
  writeOwnerDataToFirestore(ownerStoreId, { customHours: ownerData[ownerStoreId].customHours });
  renderOwnerDash();
  showToast(ownerData[ownerStoreId].customHours[dayIdx] === false ? '🚫 定休日に設定しました' : '✅ 営業日に戻しました');
}

function ownerResetHours(){
  ownerData[ownerStoreId].customHours = {};
  writeOwnerDataToFirestore(ownerStoreId, { customHours: ownerData[ownerStoreId].customHours });
  renderOwnerDash();
  showToast('↩ 営業時間をリセットしました');
}

function renderOwnerMenuTab() {
  const s = STORES.find(x => x.id === ownerStoreId);
  const od = ownerData[ownerStoreId];
  if(!od.menu) od.menu = JSON.parse(JSON.stringify(s.menu || []));

  document.getElementById('ownerMenuBody').innerHTML = `
    <div class="owner-section" style="padding-bottom:120px">
      <div class="owner-section-title">🍽️ メニュー管理</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:14px">ここで設定したメニューがユーザーの店舗詳細に表示されます</div>
      <div id="ownerMenuList"></div>
      <button onclick="ownerMenuAddCat()" style="width:100%;font-size:13px;font-weight:700;color:var(--brand);background:var(--brand-light);border:2px dashed var(--brand);border-radius:12px;padding:12px;cursor:pointer;margin:10px 0">
        ＋ カテゴリを追加
      </button>
      <button onclick="ownerMenuSave()" style="width:100%;font-size:14px;font-weight:800;color:#fff;background:var(--brand);border:none;border-radius:12px;padding:14px;cursor:pointer">

      </button>

  _renderOwnerMenuList();

function _renderOwnerMenuList() {
  const od = ownerData[ownerStoreId];
  const menu = od.menu || [];
  const el = document.getElementById('ownerMenuList');
  if(!el) return;
  el.innerHTML = menu.map((cat, ci) => `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <input value="${cat.cat.replace(/"/g,'&quot;')}" onchange="ownerMenuCatName(${ci},this.value)"
          style="flex:1;font-size:14px;font-weight:700;border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:var(--bg)"
          placeholder="カテゴリ名（例：ラーメン）">
        <button onclick="ownerMenuDelCat(${ci})" style="background:#fee8e8;color:#c0392b;border:none;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer">🗑 削除</button>
      </div>
      ${cat.items.map((item, ii) => `
        <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
          <input value="${(item.n||'').replace(/"/g,'&quot;')}" onchange="ownerMenuItemField(${ci},${ii},'n',this.value)"
            style="flex:2;font-size:12px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:var(--bg)"
            placeholder="メニュー名">
          <input value="${(item.p||'').replace(/"/g,'&quot;')}" onchange="ownerMenuItemField(${ci},${ii},'p',this.value)"
            style="width:72px;font-size:12px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:var(--bg)"
            placeholder="価格">
          <button onclick="ownerMenuDelItem(${ci},${ii})" style="background:none;border:none;color:#c0392b;font-size:18px;cursor:pointer;padding:0 4px;flex-shrink:0">✕</button>
        </div>
      `).join('')}
      <button onclick="ownerMenuAddItem(${ci})" style="font-size:12px;color:var(--brand);background:var(--brand-light);border:none;border-radius:8px;padding:6px 12px;cursor:pointer;margin-top:4px">
        ＋ 項目を追加
      </button>
    </div>
  `).join('');
}

function ownerMenuCatName(ci, val){ ownerData[ownerStoreId].menu[ci].cat = val; }
function ownerMenuItemField(ci, ii, field, val){ ownerData[ownerStoreId].menu[ci].items[ii][field] = val; }
function ownerMenuAddItem(ci){
  ownerData[ownerStoreId].menu[ci].items.push({n:'',p:'',note:''});
  _renderOwnerMenuList();
}
function ownerMenuDelItem(ci, ii){
  ownerData[ownerStoreId].menu[ci].items.splice(ii,1);
  _renderOwnerMenuList();
}
function ownerMenuAddCat(){
  ownerData[ownerStoreId].menu.push({cat:'新しいカテゴリ',items:[{n:'',p:'',note:''}]});
  _renderOwnerMenuList();
}
function ownerMenuDelCat(ci){
  if(!confirm('このカテゴリを削除しますか？')) return;
  ownerData[ownerStoreId].menu.splice(ci,1);
  _renderOwnerMenuList();
}
function ownerMenuSave(){
  const menu = ownerData[ownerStoreId].menu;
  writeOwnerDataToFirestore(ownerStoreId, { menu });
  const s = STORES.find(x=>x.id===ownerStoreId);
  if(s) s.menu = JSON.parse(JSON.stringify(menu));
  showToast('✅ メニューを保存しました！');
}

function toggleJob(jobId) {
  const od = ownerData[ownerStoreId];
  const j  = od.jobs.find(x => x.id === jobId);

}

function deleteJob(jobId) {
  ownerData[ownerStoreId].jobs = ownerData[ownerStoreId].jobs.filter(x => x.id !== jobId);
  renderOwnerJobs();
  showToast('🗑 求人を削除しました');
}

function openJobForm() {
  document.getElementById('jobFormSheet').innerHTML = `
    <div class="sheet-handle"></div>
    <div class="job-form">
      <h2>💼 バイト求人を追加</h2>
      <p class="jf-sub">入力後すぐに掲載できます</p>

      <div class="fg"><label>時給 *</label>
        <input id="jf-pay" type="text" placeholder="例：時給1,200円〜"></div>
      <div class="fg"><label>シフト・勤務時間</label>

      <div class="fg"><label>仕事内容・アピール</label>
        <textarea id="jf-note" placeholder="例：まかない無料！未経験OK・学生歓迎🎉" style="min-height:80px"></textarea></div>
      <button class="submit-btn" onclick="submitJob()">掲載する ✨</button>
    </div>
  `;
  document.getElementById('jobFormOverlay').classList.add('open');
