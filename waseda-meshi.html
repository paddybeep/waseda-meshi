function submitJob() {
  const title = document.getElementById('jf-title').value.trim();
  const pay   = document.getElementById('jf-pay').value.trim();
  const shift = document.getElementById('jf-shift').value.trim();
  const note  = document.getElementById('jf-note').value.trim();
  if (!title || !pay) { showToast('⚠ タイトルと時給は必須です'); return; }
  const od = ownerData[ownerStoreId];
  const newId = od.jobs.length ? Math.max(...od.jobs.map(j=>j.id)) + 1 : 1;
  od.jobs.push({ id: newId, title, pay, shift: shift||'要相談', note: note||'', active: true });
  document.getElementById('jobFormOverlay').classList.remove('open');
  document.body.style.overflow = '';
  switchOwnerTab(1);
  showToast('✅ 求人を掲載しました！');
}

// ── 店舗情報タブ ──────────────────────────────────────────────
function ownerInfoRow(label, valDisplay, field) {
  return `<div class="sic-row" id="sic-${field}">
    <span class="sic-label">${label}</span>
    <span class="sic-val" style="flex:1;text-align:right;font-size:13px">${valDisplay}</span>
    <button class="sic-edit-btn" onclick="ownerEditField('${field}')" style="margin-left:8px">編集</button>
  </div>`;
}
function ownerEditField(field) {
  const s = STORES.find(x => x.id === ownerStoreId);
  const labels = { name:'店名', hours:'営業時間', closed:'定休日', seats:'総席数（数字）', maxGroup:'最大グループ（数字）', addr:'住所' };
  const val = field==='seats'?s.seats : field==='maxGroup'?s.maxGroup : s[field];
  const row = document.getElementById('sic-'+field);
  if(!row) return;
  row.innerHTML = `
    <span class="sic-label">${labels[field]||field}</span>
    <input style="flex:1;padding:5px 8px;border:1.5px solid var(--brand);border-radius:6px;font-size:13px;margin:0 6px;font-family:inherit" value="${val}" id="sic-input-${field}">
    <button class="sic-edit-btn" onclick="ownerSaveField('${field}')">保存</button>
    <button class="sic-edit-btn" style="background:var(--bg);color:var(--muted)" onclick="renderOwnerInfo()">✕</button>
  `;
  setTimeout(()=>{ const el=document.getElementById('sic-input-'+field); if(el){el.focus();el.select();} }, 50);
}
function ownerSaveField(field) {
  const s = STORES.find(x => x.id === ownerStoreId);
  const inp = document.getElementById('sic-input-'+field);
  if(!inp) return;
  const val = inp.value.trim();
  if(!val){ showToast('⚠ 入力してください'); return; }
  if(field==='seats') s.seats = parseInt(val)||s.seats;
  else if(field==='maxGroup') s.maxGroup = parseInt(val)||s.maxGroup;
  else s[field] = val;
  renderOwnerInfo();
  showToast('✅ '+field+' を更新しました');
}

function renderOwnerInfo() {
  const s  = STORES.find(x => x.id === ownerStoreId);
  document.getElementById('ownerInfoBody').innerHTML = `
    <div class="owner-section">
      <div class="owner-section-title">🏪 店舗情報</div>
      <div class="store-info-card">
        ${ownerInfoRow('店名', s.name, 'name')}
        <div class="sic-row"><span class="sic-label">ジャンル</span><span class="sic-val">${s.genre}</span></div>
        ${ownerInfoRow('営業時間', s.hours, 'hours')}
        ${ownerInfoRow('定休日', s.closed, 'closed')}
        ${ownerInfoRow('住所', s.addr, 'addr')}
        ${ownerInfoRow('総席数', s.seats+'席', 'seats')}
        ${ownerInfoRow('最大グループ', s.maxGroup+'人まで', 'maxGroup')}
      </div>
    </div>

    <div class="owner-section">
      <div class="owner-section-title">💬 店からのひとこと（PR）</div>
      <textarea class="today-special-input" id="ownerPrText" style="min-height:100px" placeholder="お客様へのメッセージを入力">${s.pr}</textarea>
      <button onclick="ownerSavePR()" style="margin-top:8px;width:100%;padding:11px;background:var(--grad);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer">保存する</button>
    </div>

    <div class="owner-section">
      <div class="owner-section-title">📋 掲載プラン</div>
      <div style="background:var(--surface);border-radius:14px;padding:16px;border:1px solid var(--border)">
        <div style="font-size:13px;color:var(--muted);margin-bottom:10px">現在のプラン</div>
        <div style="font-size:20px;font-weight:900;color:var(--brand);margin-bottom:4px">${s.paid?'スタンダード ¥2,000/月':'無料プラン'}</div>
        <div style="font-size:12px;color:var(--sub);margin-bottom:12px">${s.paid?'上位表示・メニュー無制限・混雑手動更新':'基本情報のみ'}</div>
        ${!s.paid?`<button onclick="showToast('📩 アップグレードのご案内をメールで送ります')" style="width:100%;padding:10px;background:var(--grad);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer">スタンダードにアップグレード</button>`:''}
      </div>
    </div>
  `;
}
function ownerSavePR() {
  const s = STORES.find(x => x.id === ownerStoreId);
  const val = document.getElementById('ownerPrText').value.trim();
  if(val) s.pr = val;
  showToast('✅ PRを更新しました');
}

// ── ユーザー側の求人表示（店舗詳細に追加） ───────────────────
function jobListingsHTML(storeId) {
  const jobs = ownerData[storeId]?.jobs?.filter(j => j.active) || [];
  if (!jobs.length) return '';
  return `
    <div class="job-listing-section">
      <div class="section-divider">💼 バイト募集</div>
      ${jobs.map(j => `
        <div class="job-listing-card">
          <div class="jlc-header">
            <span class="jlc-badge">募集中</span>
            <span class="jlc-title">${j.title}</span>
          </div>
          <div class="jlc-meta">
            💰 ${j.pay}<br>
            🕐 ${j.shift}<br>
            📝 ${j.note}
          </div>
          <button class="jlc-apply-btn" onclick="openApplyForm('${j.title}', s.name)">応募する</button>
        </div>
      `).join('')}
    </div>
  `;
}
