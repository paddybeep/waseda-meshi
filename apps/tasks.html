<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タスク管理</title>
<style>
  :root {
    --uf-orange: #FA4616;
    --uf-blue:   #003087;
    --uf-blue2:  #0A4DA6;
    --uf-light:  #E8EEF8;
    --bg:        #F4F6FB;
    --white:     #FFFFFF;
    --text:      #1a1a2e;
    --muted:     #6b7280;
    --border:    #dde3f0;
    --shadow:    0 2px 12px rgba(0,48,135,.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ===== HEADER ===== */
  header {
    background: linear-gradient(135deg, var(--uf-blue) 0%, var(--uf-blue2) 60%, #1a3a8a 100%);
    color: #fff; padding: 0 32px;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px; box-shadow: 0 3px 16px rgba(0,48,135,.25);
  }
  .logo { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
  .logo-icon { width: 36px; height: 36px; background: var(--uf-orange); border-radius: 8px;
    display: grid; place-items: center; font-size: 18px; }
  .header-stats { display: flex; gap: 20px; font-size: 13px; }
  .stat { text-align: center; }
  .stat strong { display: block; font-size: 20px; font-weight: 700; color: var(--uf-orange); }

  /* ===== LAYOUT ===== */
  main { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }

  /* ===== TOOLBAR ===== */
  .toolbar {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    background: var(--white); border-radius: 14px; padding: 16px 20px;
    box-shadow: var(--shadow); margin-bottom: 24px;
  }
  .toolbar input[type=text] {
    flex: 1; min-width: 180px; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 9px 14px; font-size: 14px; outline: none; transition: border .2s;
  }
  .toolbar input[type=text]:focus { border-color: var(--uf-blue2); }
  .toolbar select {
    border: 1.5px solid var(--border); border-radius: 8px; padding: 9px 12px;
    font-size: 14px; background: #fff; cursor: pointer; outline: none;
  }
  .btn-add {
    background: var(--uf-orange); color: #fff; border: none; border-radius: 8px;
    padding: 9px 22px; font-size: 14px; font-weight: 700; cursor: pointer;
    transition: opacity .15s, transform .1s; white-space: nowrap;
  }
  .btn-add:hover { opacity: .88; }
  .btn-add:active { transform: scale(.96); }

  /* ===== FILTER BAR ===== */
  .filter-bar {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; align-items: center;
  }
  .filter-label { font-size: 13px; color: var(--muted); margin-right: 4px; }
  .filter-btn {
    padding: 6px 16px; border-radius: 20px; border: 1.5px solid var(--border);
    background: #fff; font-size: 13px; cursor: pointer; transition: all .15s; font-weight: 500;
  }
  .filter-btn.active { background: var(--uf-blue); color: #fff; border-color: var(--uf-blue); }
  .filter-btn:hover:not(.active) { border-color: var(--uf-blue2); color: var(--uf-blue2); }
  .search-box {
    margin-left: auto; border: 1.5px solid var(--border); border-radius: 20px;
    padding: 6px 14px; font-size: 13px; outline: none; width: 200px; transition: border .2s;
  }
  .search-box:focus { border-color: var(--uf-blue2); }

  /* ===== TASK LIST ===== */
  .task-list { display: flex; flex-direction: column; gap: 10px; }
  .empty { text-align: center; padding: 60px 0; color: var(--muted); font-size: 15px; }
  .empty span { display: block; font-size: 40px; margin-bottom: 12px; }

  /* ===== TASK CARD ===== */
  .task-card {
    background: var(--white); border-radius: 12px; padding: 16px 20px;
    box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px;
    border-left: 5px solid var(--border); transition: transform .15s, box-shadow .15s;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform:none; } }
  .task-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,48,135,.14); }
  .task-card.done { opacity: .55; }
  .task-card.done .task-title { text-decoration: line-through; color: var(--muted); }
  .task-card[data-priority="高"] { border-left-color: #ef4444; }
  .task-card[data-priority="中"] { border-left-color: var(--uf-orange); }
  .task-card[data-priority="低"] { border-left-color: #22c55e; }

  .task-check { width: 22px; height: 22px; flex-shrink: 0; cursor: pointer; accent-color: var(--uf-blue); }

  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 15px; font-weight: 600; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px;
  }
  .badge-priority-高 { background: #fee2e2; color: #dc2626; }
  .badge-priority-中 { background: #ffedd5; color: #ea580c; }
  .badge-priority-低 { background: #dcfce7; color: #16a34a; }

  .badge-status-未着手 { background: #f3f4f6; color: #6b7280; }
  .badge-status-進行中 { background: #dbeafe; color: #2563eb; }
  .badge-status-完了   { background: #d1fae5; color: #059669; }

  .due-date { font-size: 12px; color: var(--muted); }
  .due-date.overdue { color: #dc2626; font-weight: 600; }
  .due-date.soon { color: var(--uf-orange); font-weight: 600; }

  .task-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-icon {
    width: 32px; height: 32px; border-radius: 8px; border: none; cursor: pointer;
    display: grid; place-items: center; font-size: 15px; transition: background .15s;
    background: transparent;
  }
  .btn-edit { color: var(--uf-blue2); }
  .btn-edit:hover { background: var(--uf-light); }
  .btn-delete { color: #dc2626; }
  .btn-delete:hover { background: #fee2e2; }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; animation: fadeInBg .15s;
  }
  @keyframes fadeInBg { from{opacity:0} to{opacity:1} }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: #fff; border-radius: 16px; padding: 32px 28px; width: 480px; max-width: 95vw;
    box-shadow: 0 20px 60px rgba(0,0,0,.2); animation: slideUp .2s ease;
  }
  @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:none;opacity:1} }
  .modal h2 { font-size: 18px; font-weight: 800; margin-bottom: 20px; color: var(--uf-blue); }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 9px 12px; font-size: 14px; outline: none; font-family: inherit; transition: border .2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--uf-blue2); }
  .form-group textarea { resize: vertical; min-height: 72px; }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
  .btn-cancel {
    padding: 10px 20px; border: 1.5px solid var(--border); border-radius: 8px;
    background: #fff; font-size: 14px; cursor: pointer; transition: background .15s;
  }
  .btn-cancel:hover { background: var(--bg); }
  .btn-save {
    padding: 10px 24px; background: var(--uf-blue); color: #fff; border: none;
    border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .15s;
  }
  .btn-save:hover { opacity: .88; }

  /* ===== PROGRESS BAR ===== */
  .progress-wrap { margin-bottom: 20px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: var(--muted); }
  .progress-label strong { color: var(--uf-orange); }
  .progress-bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--uf-blue), var(--uf-orange)); border-radius: 99px; transition: width .4s ease; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">✓</div>
    タスク管理
  </div>
  <div class="header-stats">
    <div class="stat"><strong id="stat-total">0</strong>全体</div>
    <div class="stat"><strong id="stat-doing">0</strong>進行中</div>
    <div class="stat"><strong id="stat-done">0</strong>完了</div>
  </div>
</header>

<main>
  <!-- 進捗バー -->
  <div class="progress-wrap">
    <div class="progress-label"><span>全体の進捗</span><strong id="progress-pct">0%</strong></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>

  <!-- 追加ツールバー -->
  <div class="toolbar">
    <input type="text" id="quick-title" placeholder="タスク名を入力..." maxlength="100">
    <select id="quick-priority">
      <option value="中">優先度：中</option>
      <option value="高">優先度：高</option>
      <option value="低">優先度：低</option>
    </select>
    <input type="date" id="quick-due" style="border:1.5px solid var(--border);border-radius:8px;padding:9px 10px;font-size:14px;outline:none;">
    <button class="btn-add" onclick="quickAdd()">＋ 追加</button>
    <button class="btn-add" style="background:var(--uf-blue);" onclick="openModal()">詳細入力</button>
  </div>

  <!-- フィルターバー -->
  <div class="filter-bar">
    <span class="filter-label">絞り込み：</span>
    <button class="filter-btn active" data-filter="all"    onclick="setFilter('all',this)">すべて</button>
    <button class="filter-btn"        data-filter="未着手" onclick="setFilter('未着手',this)">未着手</button>
    <button class="filter-btn"        data-filter="進行中" onclick="setFilter('進行中',this)">進行中</button>
    <button class="filter-btn"        data-filter="完了"   onclick="setFilter('完了',this)">完了</button>
    <button class="filter-btn"        data-filter="高"     onclick="setFilter('高',this)">🔴 高優先</button>
    <input class="search-box" type="text" placeholder="🔍 検索..." oninput="renderTasks()">
  </div>

  <!-- タスク一覧 -->
  <div class="task-list" id="task-list"></div>
</main>

<!-- 詳細入力モーダル -->
<div class="modal-overlay hidden" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <h2 id="modal-title">タスクを追加</h2>
    <div class="form-group">
      <label>タスク名 *</label>
      <input type="text" id="f-title" placeholder="タスク名を入力" maxlength="100">
    </div>
    <div class="form-group">
      <label>メモ</label>
      <textarea id="f-memo" placeholder="詳細・メモ"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>優先度</label>
        <select id="f-priority">
          <option value="高">🔴 高</option>
          <option value="中" selected>🟠 中</option>
          <option value="低">🟢 低</option>
        </select>
      </div>
      <div class="form-group">
        <label>ステータス</label>
        <select id="f-status">
          <option value="未着手">未着手</option>
          <option value="進行中">進行中</option>
          <option value="完了">完了</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>期限</label>
        <input type="date" id="f-due">
      </div>
      <div class="form-group">
        <label>カテゴリ</label>
        <input type="text" id="f-category" placeholder="仕事・個人 など" maxlength="20">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-save"   onclick="saveTask()">保存</button>
    </div>
  </div>
</div>

<script>
// ===== STATE =====
let tasks = JSON.parse(localStorage.getItem('uf-tasks') || '[]');
let filter = 'all';
let editId = null;

// ===== STORAGE =====
function save() { localStorage.setItem('uf-tasks', JSON.stringify(tasks)); }

// ===== QUICK ADD =====
function quickAdd() {
  const t = document.getElementById('quick-title').value.trim();
  if (!t) { document.getElementById('quick-title').focus(); return; }
  tasks.unshift({
    id: Date.now(), title: t, memo: '', priority: document.getElementById('quick-priority').value,
    status: '未着手', due: document.getElementById('quick-due').value, category: '', createdAt: new Date().toISOString()
  });
  save(); renderTasks();
  document.getElementById('quick-title').value = '';
  document.getElementById('quick-due').value = '';
}
document.getElementById('quick-title').addEventListener('keydown', e => { if (e.key === 'Enter') quickAdd(); });

// ===== MODAL =====
function openModal(id = null) {
  editId = id;
  const task = id ? tasks.find(t => t.id === id) : null;
  document.getElementById('modal-title').textContent = id ? 'タスクを編集' : 'タスクを追加';
  document.getElementById('f-title').value    = task?.title    || '';
  document.getElementById('f-memo').value     = task?.memo     || '';
  document.getElementById('f-priority').value = task?.priority || '中';
  document.getElementById('f-status').value   = task?.status   || '未着手';
  document.getElementById('f-due').value      = task?.due      || '';
  document.getElementById('f-category').value = task?.category || '';
  document.getElementById('modal-overlay').classList.remove('hidden');
  document.getElementById('f-title').focus();
}
function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); editId = null; }
function closeModalOutside(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function saveTask() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { document.getElementById('f-title').focus(); return; }
  const data = {
    title, memo: document.getElementById('f-memo').value.trim(),
    priority: document.getElementById('f-priority').value,
    status:   document.getElementById('f-status').value,
    due:      document.getElementById('f-due').value,
    category: document.getElementById('f-category').value.trim(),
  };
  if (editId) {
    const i = tasks.findIndex(t => t.id === editId);
    tasks[i] = { ...tasks[i], ...data };
  } else {
    tasks.unshift({ id: Date.now(), ...data, createdAt: new Date().toISOString() });
  }
  save(); renderTasks(); closeModal();
}

// ===== DELETE =====
function deleteTask(id) {
  if (!confirm('このタスクを削除しますか？')) return;
  tasks = tasks.filter(t => t.id !== id);
  save(); renderTasks();
}

// ===== TOGGLE STATUS =====
function toggleDone(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  t.status = t.status === '完了' ? '未着手' : '完了';
  save(); renderTasks();
}

// ===== FILTER =====
function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTasks();
}

// ===== DUE DATE LABEL =====
function dueLabel(due) {
  if (!due) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(due); d.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  if (diff < 0)  return `<span class="due-date overdue">⚠ ${Math.abs(diff)}日超過</span>`;
  if (diff === 0) return `<span class="due-date soon">📅 今日まで</span>`;
  if (diff <= 3)  return `<span class="due-date soon">📅 あと${diff}日</span>`;
  return `<span class="due-date">📅 ${due}</span>`;
}

// ===== RENDER =====
function renderTasks() {
  const searchVal = (document.querySelector('.search-box')?.value || '').toLowerCase();
  let filtered = tasks.filter(t => {
    if (filter === 'all')  return true;
    if (filter === '高')   return t.priority === '高';
    return t.status === filter;
  }).filter(t =>
    !searchVal || t.title.toLowerCase().includes(searchVal) || (t.memo||'').toLowerCase().includes(searchVal)
  );

  // stats
  document.getElementById('stat-total').textContent = tasks.length;
  document.getElementById('stat-doing').textContent = tasks.filter(t => t.status === '進行中').length;
  document.getElementById('stat-done').textContent  = tasks.filter(t => t.status === '完了').length;
  const pct = tasks.length ? Math.round(tasks.filter(t=>t.status==='完了').length/tasks.length*100) : 0;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';

  const el = document.getElementById('task-list');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty"><span>📋</span>タスクがありません</div>`;
    return;
  }

  el.innerHTML = filtered.map(t => `
    <div class="task-card ${t.status==='完了'?'done':''}" data-priority="${t.priority}" data-id="${t.id}">
      <input type="checkbox" class="task-check" ${t.status==='完了'?'checked':''} onchange="toggleDone(${t.id})">
      <div class="task-body">
        <div class="task-title" title="${t.title}">${t.title}</div>
        <div class="task-meta">
          <span class="badge badge-priority-${t.priority}">${t.priority}</span>
          <span class="badge badge-status-${t.status}">${t.status}</span>
          ${t.category ? `<span class="badge" style="background:#ede9fe;color:#7c3aed">🏷 ${t.category}</span>` : ''}
          ${dueLabel(t.due)}
        </div>
        ${t.memo ? `<div style="font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.memo}</div>` : ''}
      </div>
      <div class="task-actions">
        <button class="btn-icon btn-edit" onclick="openModal(${t.id})" title="編集">✏️</button>
        <button class="btn-icon btn-delete" onclick="deleteTask(${t.id})" title="削除">🗑</button>
      </div>
    </div>
  `).join('');
}

renderTasks();
</script>
</body>
</html>
